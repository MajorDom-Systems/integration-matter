name: matter-HA harvest drift

# Weekly drift canary + auto-refresh PR — the sibling of zigbee's zha-drift and the same machine
# as the MVD canary (mvd-artifact.yml): sample the LATEST upstream, diff against what we vendored,
# tier the changes by risk. Deliberately UNPINNED (`--ref dev`): the vendored
# `matter_spec_ha.py` is the pin; this job exists to see what upstream changed.
#
# `majordom_matter/matter_spec_ha.py` is judgment AST-harvested from home-assistant/core's matter
# platform files (entity_category → visibility etc.) — no homeassistant install; attribute ids
# resolve via the chip bindings we already depend on. Exit codes from check_matter_ha_drift.py:
#   0  no drift        -> green
#   1  ADD/REMOVE only -> refresh the artifact and open a routine PR
#   2  RECLASSIFY      -> HIGH RISK (changes what current users already see) — flagged for review

on:
  schedule:
    - cron: "0 5 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch test.yml on the refresh PR branch

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      REFRESH_BRANCH: chore/ha-harvest-refresh-verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package (chip bindings come with it)
        run: |
          set -euo pipefail
          pip install poetry
          poetry install

      - name: Check drift against the vendored artifact
        id: drift
        run: |
          set -euo pipefail
          set +e
          poetry run python scripts/check_matter_ha_drift.py --ref dev 2> "$RUNNER_TEMP/drift.txt"  # outside the checkout: not committed into the PR
          code=$?
          set -e
          cat "$RUNNER_TEMP/drift.txt"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 2 ]; then exit "$code"; fi  # real failure, not a drift signal

      - name: Refresh the vendored artifact
        if: steps.drift.outputs.code != '0'
        run: poetry run python scripts/harvest_matter_ha.py --ref dev --out majordom_matter/matter_spec_ha.py

      - name: Open the refresh PR
        id: cpr
        if: steps.drift.outputs.code != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ env.REFRESH_BRANCH }}
          commit-message: "chore(matter): refresh the vendored HA-matter harvest"
          title: "${{ steps.drift.outputs.code == '2' && '⚠️ HIGH RISK: ' || '' }}Refresh vendored HA-matter harvest"
          body-path: ${{ runner.temp }}/drift.txt
          labels: ${{ steps.drift.outputs.code == '2' && 'drift,high-risk' || 'drift' }}
          delete-branch: true

      - name: Auto-merge the low-risk refresh
        # Only exit 1 (ADD/REMOVE) auto-merges — RECLASSIFY (exit 2) is left open for human review.
        # A PR opened with GITHUB_TOKEN triggers no `pull_request` workflows (GitHub's anti-recursion
        # rule), so test.yml is dispatched on the PR branch explicitly — workflow_dispatch is exempt.
        # Merges only if that run passes; a failing run fails this step and leaves the PR open.
        # Self-contained: no PAT, branch protection or repo "Allow auto-merge" setting required.
        if: steps.drift.outputs.code == '1' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          gh workflow run test.yml --ref "$REFRESH_BRANCH"
          run_id=""
          for _ in $(seq 12); do                     # the dispatched run takes a few seconds to appear
            sleep 10
            run_id=$(gh run list --workflow test.yml --event workflow_dispatch --commit "$SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
          done
          [ -n "$run_id" ] || { echo "::error::dispatched test.yml run for $SHA never appeared"; exit 1; }
          gh run watch "$run_id" --exit-status --interval 20
          gh pr merge "$PR" --squash --delete-branch
