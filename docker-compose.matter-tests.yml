# Matter integration test stack: matterjs-server (the image the integration ships) + a container that runs the
# integration's virtual-device suite against real MVD `chef` binaries.
#
# Run:  docker compose -f docker-compose.matter-tests.yml up --build \
#         --exit-code-from matter-integration-tests
# On Apple Silicon add the mac override (Rosetta):  -f docker-compose.matter-tests.mac.yml
services:
  matter-server:
    # same digest as majordom_matter/config.py; bump both together
    image: ghcr.io/matter-js/matterjs-server@sha256:3c4779a606d49d8ad5a628b448057812e1a450e90faf30f7e2b2c287d4758e30
    user: "0:0"  # the image's own uid 1000 can't write the bind-mounted ./matter_data
    restart: unless-stopped
    privileged: true
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
    volumes:
      - ./matter_data:/data
    # the MVD chef devices carry test attestation: test-net DCL plus the PAA certs fetched into ./matter_data/credentials
    command: --storage-path /data --certificates-dir /data/credentials --enable-test-net-dcl --primary-interface eth0
    networks: [matter-net]

  matter-integration-tests:
    build:
      context: .             # repo root; the SDK is a published PyPI dependency
      dockerfile: docker/Dockerfile.test
    privileged: true
    depends_on: [matter-server]
    environment:
      - MATTER_SERVER_URL=ws://matter-server:5580  # the base URL: the suite adds /ws
      - MATTER_DISCOVERY_TIMEOUT_S=12
      - MATTER_INTEGRATION_TESTS=1
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    networks: [matter-net]

networks:
  matter-net:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.16.238.0/24
        - subnet: fd00:db8:1::/64
